name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow-test-password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://taskflow:taskflow-test-password@localhost:5432/taskflow_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install migration tool
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply test migrations
        run: $(go env GOPATH)/bin/migrate -path ./migrations -database "$TEST_DATABASE_URL" up

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1
